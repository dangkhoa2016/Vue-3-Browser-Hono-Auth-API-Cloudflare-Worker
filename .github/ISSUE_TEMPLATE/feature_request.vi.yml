name: Đề xuất tính năng (Tiếng Việt)
description: Đề xuất cải tiến có mục tiêu rõ ràng.
title: '[Feature] '
body:
- type: markdown
  attributes:
    value: Issue là công khai. Không gửi mật khẩu, token, dữ liệu tài khoản thật, localStorage hoặc HAR chưa che dữ liệu. Báo lỗ hổng riêng theo [SECURITY.md](https://github.com/dangkhoa2016/Vue-3-Browser-Hono-Auth-API-Cloudflare-Worker/blob/main/.github/SECURITY.md).
- type: textarea
  id: problem
  attributes:
    label: Vấn đề cần giải quyết
    description: Mô tả người dùng, tác vụ và trở ngại hiện tại.
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Hành vi đề xuất
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Tiêu chí nghiệm thu
    description: Nêu kết quả có thể quan sát và cách kiểm chứng.
  validations:
    required: true
- type: textarea
  id: impact
  attributes:
    label: Ảnh hưởng và phương án khác
    description: Nêu ảnh hưởng API/backend, quyền, bản dịch, khả năng truy cập và chế độ sáng/tối nếu có.
  validations:
    required: false
