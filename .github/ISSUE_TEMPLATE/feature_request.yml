name: Feature request (English)
description: Propose a focused frontend improvement.
title: '[Feature] '
body:
- type: markdown
  attributes:
    value: Issues are public. Do not include passwords, tokens, real account data, localStorage dumps or unredacted HAR files. Report vulnerabilities privately through [SECURITY.md](https://github.com/dangkhoa2016/Vue-3-Browser-Hono-Auth-API-Cloudflare-Worker/blob/main/.github/SECURITY.md).
- type: textarea
  id: problem
  attributes:
    label: Problem to solve
    description: Describe the user, task and current limitation.
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Proposed behavior
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
    description: Describe observable outcomes and how to verify them.
  validations:
    required: true
- type: textarea
  id: impact
  attributes:
    label: Impact and alternatives
    description: Consider API/backend, roles, localization, accessibility and light/dark themes.
  validations:
    required: false
